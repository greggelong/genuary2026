<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Webcam Mirror Life - Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 20px);
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .controls {
            background: rgba(30, 30, 30, 0.95);
            padding: 12px;
            margin: 10px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 1px solid #444;
            max-width: 95vw;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        canvas {
            background-color: #111;
            border: 2px solid #333;
            max-width: 95vw;
            max-height: 65vh;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }

        video {
            display: none;
        }

        button {
            background: #444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background: #666;
        }

        input[type=range] {
            width: 80px;
        }
    </style>
</head>

<body>

    <div class="controls">
        <div class="control-group">
            <label>Resolution</label>
            <input type="range" id="gridSlider" min="20" max="100" value="50">
        </div>
        <div class="control-group">
            <label>Delay</label>
            <input type="range" id="speedSlider" min="0" max="300" value="50">
        </div>
        <div class="control-group">
            <button id="clearBtn">Clear</button>
            <button id="randomBtn">Random</button>
        </div>
        <div class="control-group">
            <select id="presetSelect">
                <option value="glider">Glider</option>
                <option value="gosper">Gosper Gun</option>
                <option value="pulsar">Pulsar</option>
            </select>
        </div>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="mycanvas"></canvas>

    <script>
        const cnv = document.getElementById("mycanvas");
        const ctx = cnv.getContext('2d');
        const video = document.getElementById('webcam');
        const gridSlider = document.getElementById('gridSlider');
        const speedSlider = document.getElementById('speedSlider');
        const presetSelect = document.getElementById('presetSelect');

        cnv.width = 800;
        cnv.height = 800;

        let gridsz = parseInt(gridSlider.value);
        let csz = cnv.width / gridsz;
        let grid = [];

        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) { alert("Please enable webcam for the effects."); }
        }

        function createEmptyGrid(sz) {
            let arr = [];
            for (let j = 0; j < sz; j++) {
                arr[j] = new Uint8Array(sz);
            }
            return arr;
        }

        function countNeighbors(row, col) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let r = (row + i + gridsz) % gridsz;
                    let c = (col + j + gridsz) % gridsz;
                    sum += grid[r][c];
                }
            }
            return sum;
        }

        function updateGrid() {
            let next = createEmptyGrid(gridsz);
            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) {
                    let n = countNeighbors(j, i);
                    if (grid[j][i] === 1) {
                        next[j][i] = (n === 2 || n === 3) ? 1 : 0;
                    } else {
                        next[j][i] = (n === 3) ? 1 : 0;
                    }
                }
            }
            grid = next;
        }

        function showGrid() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, cnv.width, cnv.height);

            ctx.save();
            ctx.translate(cnv.width, 0);
            ctx.scale(-1, 1);

            const vW = video.videoWidth || 640;
            const vH = video.videoHeight || 480;

            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) {
                    if (grid[j][i] === 1) {
                        ctx.drawImage(
                            video,
                            (i / gridsz) * vW, (j / gridsz) * vH, vW / gridsz, vH / gridsz,
                            i * csz, j * csz, csz, csz
                        );
                    }
                }
            }
            ctx.restore();
        }

        function handleAction(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = cnv.getBoundingClientRect();

            const normX = (clientX - rect.left) / rect.width;
            const normY = (clientY - rect.top) / rect.height;

            let col = Math.floor(normX * gridsz);
            let row = Math.floor(normY * gridsz);
            col = (gridsz - 1) - col; // Mirror adjustment

            const type = presetSelect.value;
            if (type === 'glider') {
                [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]].forEach(o => {
                    grid[(row + o[0] + gridsz) % gridsz][(col + o[1] + gridsz) % gridsz] = 1;
                });
            } else if (type === 'pulsar') {
                const p = [2, 3, 4, 8, 9, 10];
                p.forEach(z => {
                    grid[(row + z) % gridsz][col] = 1;
                    grid[row][(col + z) % gridsz] = 1;
                });
            } else if (type === 'gosper') {
                const pattern = [[5, 1], [5, 2], [6, 1], [6, 2], [5, 11], [6, 11], [7, 11], [4, 12], [8, 12], [3, 13], [9, 13], [3, 14], [9, 14], [6, 15], [4, 16], [8, 16], [5, 17], [6, 17], [7, 17], [6, 18], [3, 21], [4, 21], [5, 21], [3, 22], [4, 22], [5, 22], [2, 23], [6, 23], [1, 25], [2, 25], [6, 25], [7, 25], [3, 35], [4, 35], [3, 36], [4, 36]];
                pattern.forEach(o => {
                    grid[(row + o[0] + gridsz) % gridsz][(col + o[1] + gridsz) % gridsz] = 1;
                });
            }
        }

        cnv.addEventListener('mousedown', handleAction);
        cnv.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(e); }, { passive: false });

        gridSlider.addEventListener('input', () => {
            gridsz = parseInt(gridSlider.value);
            csz = cnv.width / gridsz;
            grid = createEmptyGrid(gridsz);
        });

        document.getElementById('clearBtn').onclick = () => grid = createEmptyGrid(gridsz);
        document.getElementById('randomBtn').onclick = () => {
            for (let j = 0; j < gridsz; j++) for (let i = 0; i < gridsz; i++) grid[j][i] = Math.random() > 0.7 ? 1 : 0;
        };

        function loop() {
            updateGrid();
            showGrid();
            setTimeout(() => {
                requestAnimationFrame(loop);
            }, parseInt(speedSlider.value));
        }

        setupWebcam();
        grid = createEmptyGrid(gridsz);
        loop();
    </script>
</body>

</html>
