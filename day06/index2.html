<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: blue;
        }

        canvas {
            /*border: 4px solid black;*/
            background-color: rgb(255, 104, 203)
        }
    </style>
</head>

<body>
    <canvas id="mycanvas"></canvas>

    <script>
        let lastTime = 0;
        const interval = 200; // Time in milliseconds (200ms = 5 frames per second)
        const cnv = document.getElementById("mycanvas")
        const ctx = cnv.getContext('2d')
        cnv.width = 806
        cnv.height = 806
        let gridsz = 20
        let csz = Math.floor(cnv.width / gridsz)//cell size



        const grid = []


        function makeGrid(sz) {
            for (let j = 0; j < sz; j++) {
                grid[j] = []
                for (let i = 0; i < sz; i++) {
                    grid[j][i] = Math.floor(Math.random() * 2)
                }

            }

        }




        function showGrid() {
            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) {
                    if (grid[j][i] == 1) {
                        ctx.fillStyle = 'rgb(255,255,0)'

                    } else {
                        ctx.fillStyle = 'rgb(0,0,0)'
                    }
                    ctx.beginPath()
                    ctx.rect(i * csz + 6, j * csz + 6, csz - 6, csz - 6)
                    ctx.fill()
                }
            }
        }

        function updateGrid() {
            makeGrid(gridsz)
        }


        function step(currentTime) {

            // 1. Calculate how much time passed since the last successful update
            const deltaTime = currentTime - lastTime;

            console.log(deltaTime)
            // 2. If enough time has passed, run the logic
            if (deltaTime > interval) {
                updateGrid();
                showGrid();

                // Save the current time so we can start the next wait period
                lastTime = currentTime;
            }

            // 3. Keep the loop going at full speed (60fps)
            // but the 'if' statement above controls the actual speed of the logic
            requestAnimationFrame(step);
            //requestAnimationFrame(step); // This creates the continuous loop
        }

        step();


    </script>


</body>

</html>
