<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Webcam Mirror Game of Life</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 20px);
            /* 'manipulation' allows pinch-zoom but disables double-tap-to-zoom (which is annoying) */
            touch-action: manipulation;
            font-family: sans-serif;
        }

        .controls {
            background: rgba(40, 40, 40, 0.9);
            padding: 10px;
            margin: 10px 0;
            border-radius: 12px;
            z-index: 100;
            /* Keep controls above everything */
            display: flex;
            gap: 12px;
            align-items: center;
        }

        canvas {
            background-color: #111;
            border: 1px solid #333;
            max-width: 95vw;
            height: auto;
            display: block;
            /* Critical for adding gliders accurately while zoomed */
            cursor: crosshair;
        }

        video {
            display: none;
        }
    </style>
</head>

<body>
    <div class="controls">
        <label for="gridSlider">Grid Resolution:</label>
        <input type="range" id="gridSlider" min="25" max="100" value="100" step="1">
        <span id="resVal">100</span>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="mycanvas"></canvas>

    <script>
        const cnv = document.getElementById("mycanvas");
        const ctx = cnv.getContext('2d');
        const video = document.getElementById('webcam');
        const slider = document.getElementById('gridSlider');
        const resVal = document.getElementById('resVal');

        cnv.width = 800;
        cnv.height = 800;

        let gridsz = parseInt(slider.value);
        let csz = cnv.width / gridsz;
        let grid = [];
        let nextGrid = [];

        // 1. Handle Slider Changes
        slider.addEventListener('input', () => {
            gridsz = parseInt(slider.value);
            resVal.innerText = gridsz;
            csz = cnv.width / gridsz;
            makeGrid(gridsz); // Re-initialize the board
        });

        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                console.error("Webcam access denied: ", err);
            }
        }

        function makeGrid(sz) {
            grid = [];
            nextGrid = [];
            for (let j = 0; j < sz; j++) {
                grid[j] = [];
                nextGrid[j] = [];
                for (let i = 0; i < sz; i++) {
                    grid[j][i] = Math.random() > 0.35 ? 1 : 0;
                    nextGrid[j][i] = 0;
                }
            }
        }

        function countNeighbors(row, col) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let r = (row + i + gridsz) % gridsz;
                    let c = (col + j + gridsz) % gridsz;
                    sum += grid[r][c];
                }
            }
            return sum;
        }

        function updateGrid() {
            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) {
                    let neighbors = countNeighbors(j, i);
                    if (grid[j][i] == 0 && neighbors == 3) nextGrid[j][i] = 1;
                    else if (grid[j][i] == 1 && (neighbors < 2 || neighbors > 3)) nextGrid[j][i] = 0;
                    else nextGrid[j][i] = grid[j][i];
                }
            }
            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) grid[j][i] = nextGrid[j][i];
            }
        }

        function showGrid() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, cnv.width, cnv.height);

            ctx.save();
            ctx.translate(cnv.width, 0);
            ctx.scale(-1, 1);

            // We calculate source dimensions once per frame
            const vW = video.videoWidth;
            const vH = video.videoHeight;

            for (let j = 0; j < gridsz; j++) {
                for (let i = 0; i < gridsz; i++) {
                    if (grid[j][i] == 1) {
                        ctx.drawImage(
                            video,
                            (i / gridsz) * vW, (j / gridsz) * vH,
                            vW / gridsz, vH / gridsz,
                            i * csz, j * csz, csz, csz // Removed -1 for cleaner high-res look
                        );
                    }
                }
            }
            ctx.restore();
        }

        function step(frameTime) {
            updateGrid();
            showGrid();
            requestAnimationFrame(step);
        }

        cnv.addEventListener('mousedown', (e) => {
            const rect = cnv.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            let col = Math.floor(mouseX / csz);
            let row = Math.floor(mouseY / csz);
            col = (gridsz - 1) - col;

            [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]].forEach(o => {
                let r = (row + o[0] + gridsz) % gridsz;
                let c = (col + o[1] + gridsz) % gridsz;
                grid[r][c] = 1;
            });
        });

        setupWebcam();
        makeGrid(gridsz);
        requestAnimationFrame(step);
    </script>
</body>

</html>
