<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Grid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        #sketch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            display: block;
            border: 2px solid #fff;
        }

        #slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #333;
            padding: 15px 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
        }

        #slider-container label {
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
            min-width: 120px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #555;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        #threshold-value {
            color: #00d4ff;
            font-weight: bold;
            min-width: 40px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div id="sketch-container">
        <div id="slider-container">
            <label for="darkThresholdSlider">Brightness Threshold:</label>
            <input type="range" id="darkThresholdSlider" min="0" max="256" value="70">
            <span id="threshold-value">70</span>
        </div>
        <div id="slider-container">
            <label for="countThresholdSlider">Dark Count:</label>
            <input type="range" id="countThresholdSlider" min="0" max="256" value="90">
            <span id="count-value">90</span>
        </div>
    </div>
    <script src="sketch.js"></script>
</body>

</html>
